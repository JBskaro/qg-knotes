name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install the pinned libraries
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Formatting
        run: python -m ruff format --check knotes tests check.py build.py launch.pyw
      - name: Quality guard
        env:
          PYTHONIOENCODING: utf-8
        run: python -X utf8 check.py
